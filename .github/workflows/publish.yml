name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (tag or SHA) to publish"
        required: false

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm trusted-publishing client
        run: npm install --global npm@11.16.0 && npm --version

      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Pack check
        run: npm pack --dry-run --json >/dev/null

      # Trusted publishing (OIDC): no NPM_TOKEN needed.
      # Trusted publisher registered via: npm trust github pi-alibaba-models
      #   --repository Fornace/pi-alibaba-models --file publish.yml --allow-publish
      - name: Publish
        run: npm publish --access public
